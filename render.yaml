services:
  - type: web
    name: kompot-api
    runtime: docker
    plan: free
    dockerfilePath: ./kompot/Dockerfile
    dockerContext: ./kompot
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_CORS_ORIGINS
        sync: false

  - type: web
    name: kompot-web
    runtime: docker
    plan: free
    dockerfilePath: ./kompot_frontend/Dockerfile
    dockerContext: ./kompot_frontend
    envVars:
      - key: API_URL
        sync: false
