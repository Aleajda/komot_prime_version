name: build

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package API
        working-directory: kompot
        run: mvn -B -DskipTests package

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: kompot_frontend/package-lock.json
      - name: Build web
        working-directory: kompot_frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api
        run: npm ci && npm run build
